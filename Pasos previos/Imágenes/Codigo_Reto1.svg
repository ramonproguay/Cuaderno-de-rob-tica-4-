<svg xmlns="http://www.w3.org/2000/svg" width="700" height="480"><rect width="100%" height="100%" fill="#f7f7f7"/><text x="25" y="42" font-family="monospace" font-size="22" fill="#222">Código · Reto 1</text><rect x="18" y="60" width="664" height="400" rx="10" fill="#fff" stroke="#ddd"/><text x="35" y="95" font-family="monospace" font-size="17" fill="#7b2cbf">void setup()</text><text x="35" y="118" font-family="monospace" font-size="17" fill="#222">{</text><text x="35" y="141" font-family="monospace" font-size="17" fill="#222">   pinMode(3, OUTPUT);</text><text x="35" y="164" font-family="monospace" font-size="17" fill="#222">   pinMode(2, OUTPUT);</text><text x="35" y="187" font-family="monospace" font-size="17" fill="#222">}</text><text x="35" y="210" font-family="monospace" font-size="17" fill="#222"></text><text x="35" y="233" font-family="monospace" font-size="17" fill="#7b2cbf">void loop()</text><text x="35" y="256" font-family="monospace" font-size="17" fill="#222">{</text><text x="35" y="279" font-family="monospace" font-size="17" fill="#222">   digitalWrite(3, HIGH);</text><text x="35" y="302" font-family="monospace" font-size="17" fill="#222">   digitalWrite(2, LOW);</text><text x="35" y="325" font-family="monospace" font-size="17" fill="#222">   delay(400);</text><text x="35" y="348" font-family="monospace" font-size="17" fill="#222">   digitalWrite(3, LOW);</text><text x="35" y="371" font-family="monospace" font-size="17" fill="#222">   digitalWrite(2, HIGH);</text><text x="35" y="394" font-family="monospace" font-size="17" fill="#222">   delay(400);</text><text x="35" y="417" font-family="monospace" font-size="17" fill="#222">}</text></svg>